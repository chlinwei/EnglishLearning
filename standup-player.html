<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站会英语练习器 · Standup Player</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --line:rgba(0,0,0,.12); --line2:rgba(0,0,0,.22);
    --tx:#1f1f1f; --tx2:#6b6b6b; --tx3:#9a9a9a;
    --ac:#993c1d; --ac-bg:#faece7;
  }
  html{font-size:16px}
  html[data-fs="lg"]{font-size:18.5px}
  html[data-fs="xl"]{font-size:21px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:400 1rem/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 72px;
    display:grid;grid-template-columns:minmax(200px,266px) minmax(0,1fr);gap:32px;align-items:start}
  .main{min-width:0}
  .side{position:sticky;top:22px;display:flex;flex-direction:column;gap:10px}
  .side-h{font-size:.8125rem;color:var(--tx3);padding-left:4px}
  h1{font-size:1.5rem;font-weight:500;margin:0 0 8px;line-height:1.35}
  .sub{color:var(--tx2);font-size:1rem;margin:0 0 20px;line-height:1.8}
  .picker{display:flex;flex-direction:column;gap:6px}
  .chip{width:100%;text-align:left;cursor:pointer;font:400 .9375rem/1.45 inherit;padding:11px 14px;
    border-radius:10px;border:.5px solid var(--line);background:var(--card);color:var(--tx)}
  .chip.on{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
  audio{width:100%;margin-bottom:16px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
  .bar .lbl{color:var(--tx3);font-size:.8125rem;margin-left:6px}
  button{cursor:pointer;font:400 .9375rem/1 inherit;padding:9px 13px;border-radius:8px;
    border:.5px solid var(--line2);background:var(--card);color:var(--tx)}
  button:hover{border-color:var(--ac);color:var(--ac)}
  button.on{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
  .stage{background:var(--card);border:.5px solid var(--line);border-radius:14px;
    padding:24px 26px;min-height:168px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .spk{font-size:.84375rem;color:var(--tx3)}
  .en{font-size:1.625rem;line-height:1.5}
  .zh{font-size:1.25rem;color:var(--tx2);line-height:1.65}
  .hide{display:none}
  .cnt{margin-left:auto;font-size:.84375rem;color:var(--tx3)}
  h2{font-size:1.0625rem;font-weight:500;margin:30px 0 12px;color:var(--tx2)}
  .row{display:flex;gap:13px;padding:12px 14px;border-radius:10px;cursor:pointer;border:.5px solid transparent}
  .row:hover{background:#f0efec}
  .row.on{background:var(--ac-bg);border-color:var(--ac)}
  .row .idx{color:var(--tx3);font-size:.8125rem;min-width:26px;padding-top:5px}
  .row .body{flex:1;min-width:0}
  .row .e{font-size:1.0625rem;line-height:1.6}
  .row .z{font-size:.9375rem;color:var(--tx2);margin-top:3px}
  .row .who{font-size:.84375rem;color:var(--tx3)}
  .row .rep{border:none;background:transparent;color:var(--tx3);font-size:.84375rem;padding:2px 6px}
  .row .rep:hover,.row .rep.on{color:var(--ac)}
  .tip{color:var(--tx3);font-size:.84375rem;margin-top:26px;line-height:1.9}
  kbd{border:.5px solid var(--line2);border-radius:4px;padding:1px 5px;font-size:.8125rem;background:#fff}
  code{background:#efece8;padding:1px 6px;border-radius:4px;font-size:.875rem}
  @media (max-width:880px){
    .wrap{grid-template-columns:1fr;gap:22px}
    .side{position:static}
    .picker{flex-direction:row;flex-wrap:wrap}
    .chip{width:auto}
  }
</style>
</head>
<body>
<div class="wrap">

  <aside class="side">
    <div class="side-h">5 段对话</div>
    <div class="picker" id="picker"></div>
  </aside>

  <main class="main">
  <h1>站会英语练习器</h1>
  <p class="sub">音色为印度英语合成音（第 5 段为英音）；字幕可逐句同步、随时开关。</p>

  <audio id="au" controls preload="metadata"></audio>
  <div class="sub" id="vlink" style="margin:-4px 0 14px"></div>

  <div class="bar">
    <button id="prev">上一句</button>
    <button id="next">下一句</button>
    <button id="loop">循环本句</button>
    <span class="lbl">语速</span>
    <button class="sp" data-s="0.75">0.75×</button>
    <button class="sp" data-s="1">1.0×</button>
    <button class="sp" data-s="1.25">1.25×</button>
    <span class="lbl">字幕</span>
    <button class="md" data-m="off">关</button>
    <button class="md" data-m="en">英文</button>
    <button class="md" data-m="both">中英</button>
    <button class="md" data-m="zh">中文</button>
    <span class="lbl">字号</span>
    <button class="fs" data-f="md">标准</button>
    <button class="fs" data-f="lg">大</button>
    <button class="fs" data-f="xl">特大</button>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="stage">
    <div class="spk" id="spk"></div>
    <div class="en" id="sen"></div>
    <div class="zh" id="szh"></div>
  </div>

  <h2>逐句稿（点击跳转，可单独循环）</h2>
  <div id="tr"></div>

  <p class="tip">快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 前后 3 秒 · <kbd>↑</kbd><kbd>↓</kbd> 上一句/下一句</p>
  </main>
</div>

<script>
const DATA = [{"id": "d1", "title": "01 标准站会：谁被卡住了", "file": "01-标准站会/01-标准站会.mp3", "duration": 60.89, "lines": [{"sp": "Lena", "role": "Scrum Master", "en": "Good morning everyone. Let's keep it quick — what did you do yesterday, what's today, any blockers? Alex, you're first.", "zh": "大家早上好。咱们简短一点——昨天做了什么、今天做什么、有没有阻塞？Alex，你先来。", "start": 0.0, "end": 10.8}, {"sp": "Alex", "role": "Backend", "en": "Yesterday I finished the API endpoint for user profile updates. Today I'm starting on the notification service. No blockers.", "zh": "昨天我完成了用户资料更新的 API 接口。今天开始做通知服务。没有阻塞。", "start": 10.8, "end": 22.104}, {"sp": "Lena", "role": "", "en": "Great. Maria?", "zh": "好。Maria？", "start": 22.104, "end": 25.224}, {"sp": "Maria", "role": "Frontend", "en": "I was working on the dashboard filters. Today I'll continue — but I'm blocked. The API spec for the filter endpoint still hasn't been updated. I can't finish without it.", "zh": "我一直在做看板的筛选功能。今天继续——但我被卡住了。筛选接口的 API 规格还没更新，没有它我做不完。", "start": 25.224, "end": 39.168}, {"sp": "Lena", "role": "", "en": "Noted. Alex, can you update the spec by noon?", "zh": "记下了。Alex，你能在中午前更新那份规格吗？", "start": 39.168, "end": 44.4}, {"sp": "Alex", "role": "", "en": "Sure, I'll add that to my morning.", "zh": "没问题，我上午就加上。", "start": 44.4, "end": 47.928}, {"sp": "Lena", "role": "", "en": "Thanks. Sam?", "zh": "谢谢。Sam？", "start": 47.928, "end": 51.024}, {"sp": "Sam", "role": "QA", "en": "Yesterday I wrote test cases for the login flow. Today I'll run regression on the profile update. No blockers.", "zh": "昨天我写了登录流程的测试用例。今天对资料更新跑回归测试。没有阻塞。", "start": 51.024, "end": 60.888}]}, {"id": "d2", "title": "02 印度团队远程站会", "file": "02-印度团队站会/02-印度团队站会.mp3", "duration": 64.3, "lines": [{"sp": "旁白", "role": "", "en": "Remote standup via video call. Three participants.", "zh": "远程视频站会，三位参与者。", "start": 0.0, "end": 5.232}, {"sp": "Priya", "role": "Tech Lead", "en": "OK, sprint day 7. Raj, you were working on the auth refactor?", "zh": "好，迭代第 7 天。Raj，你之前在做认证重构？", "start": 5.232, "end": 11.88}, {"sp": "Raj", "role": "", "en": "Yeah, pushed the changes yesterday. PR is up for review — it's a big one, about 400 lines. I'd actually appreciate a second reviewer if anyone has bandwidth.", "zh": "对，昨天已经把改动推上去了。PR 已经提出来等评审——挺大的，大概 400 行。如果有人有精力，我挺想再要一个评审人。", "start": 11.88, "end": 25.848}, {"sp": "Priya", "role": "", "en": "I can take a look this afternoon. James, how about the mobile push notifications?", "zh": "我下午可以看一下。James，移动端推送通知怎么样了？", "start": 25.848, "end": 33.0}, {"sp": "James", "role": "", "en": "Still in progress. I hit an issue with Firebase on Android 12 — the payload structure changed. I need another day to work around it. So my estimate was Wednesday, but I'm pushing it to Thursday.", "zh": "还在做。遇到一个 Android 12 上 Firebase 的问题——推送负载结构变了。我还需要一天绕过它。原估计周三，现在顺延到周四。", "start": 33.0, "end": 49.992}, {"sp": "Priya", "role": "", "en": "OK, flag me if you get stuck. Any risks for the Friday release?", "zh": "好，卡住了就叫我。周五发版有风险吗？", "start": 49.992, "end": 56.136}, {"sp": "James", "role": "", "en": "Low. The feature is non-critical and behind a flag.", "zh": "风险低。这个功能不是关键路径，而且在开关（feature flag）后面。", "start": 56.136, "end": 61.224}, {"sp": "Raj", "role": "", "en": "I'm good if reviews come in today.", "zh": "只要今天评审能反馈，我这边就没问题。", "start": 61.224, "end": 64.296}]}, {"id": "d3", "title": "03 迭代末站会：演示前抢修", "file": "03-迭代末站会/03-迭代末站会.mp3", "duration": 68.62, "lines": [{"sp": "旁白", "role": "", "en": "Sprint review standup. Team of five.", "zh": "迭代评审前的站会，五人团队。", "start": 0.0, "end": 4.32}, {"sp": "Tom", "role": "Scrum Master", "en": "We're on the last day of the sprint. Let's do a quick status round before the review meeting. Carla?", "zh": "今天是迭代最后一天。趁评审会之前快速过一轮状态。Carla？", "start": 4.32, "end": 13.128}, {"sp": "Carla", "role": "Backend", "en": "I finished the data export feature and it's in staging. Tested and passing. Ready for review.", "zh": "我完成了数据导出功能，已经在预发布环境。测过全部通过。可以评审了。", "start": 13.128, "end": 21.576}, {"sp": "Tom", "role": "", "en": "Good. Dan?", "zh": "好。Dan？", "start": 21.576, "end": 24.12}, {"sp": "Dan", "role": "Frontend", "en": "I'm done with the settings page UI. But I found a visual regression in the notification bell — it's a quick CSS fix, thirty minutes top. I'll push it before we demo.", "zh": "设置页 UI 我做完了。但发现通知铃铛有个视觉回归（样式退化）——一个小 CSS 修复，最多 30 分钟。演示前我会推上去。", "start": 24.12, "end": 37.728}, {"sp": "Tom", "role": "", "en": "Can you commit to that? The demo starts at two.", "zh": "你能承诺做到吗？演示两点开始。", "start": 37.728, "end": 42.36}, {"sp": "Dan", "role": "", "en": "Absolutely. I'll have it done by one thirty.", "zh": "当然。一点半之前搞定。", "start": 42.36, "end": 47.208}, {"sp": "Tom", "role": "", "en": "Great. Nina?", "zh": "很好。Nina？", "start": 47.208, "end": 49.92}, {"sp": "Nina", "role": "QA", "en": "I completed test coverage for Carla's feature — forty-seven test cases, all passing. I also found a low-priority bug in the user settings form — filed it as a backlog item, not a blocker.", "zh": "我完成了 Carla 那个功能的测试覆盖——47 个用例全部通过。另外在用户设置表单里发现一个低优先级缺陷——已作为待办项登记，不算阻塞。", "start": 49.92, "end": 64.2}, {"sp": "Tom", "role": "", "en": "Perfect. Sprint's looking good for closure.", "zh": "完美。这个迭代收尾看起来没问题。", "start": 64.2, "end": 68.616}]}, {"id": "d4", "title": "04 速率复盘 + 事故跟进", "file": "04-速率复盘/04-速率复盘.mp3", "duration": 75.22, "lines": [{"sp": "旁白", "role": "", "en": "End of sprint standup. Focus on velocity.", "zh": "迭代末站会，重点谈速率。", "start": 0.0, "end": 4.776}, {"sp": "Sophie", "role": "Lead Dev", "en": "Last item before we wrap — velocity. We committed to thirty-four points this sprint. Ben, what did we actually deliver?", "zh": "收尾前最后一项——速率。这个迭代我们承诺了 34 个点。Ben，实际交付了多少？", "start": 4.776, "end": 15.576}, {"sp": "Ben", "role": "PM", "en": "We shipped twenty-eight. Six points slipped: the email digest feature moved to next sprint — the third-party integration took longer than estimated.", "zh": "交付了 28 个。有 6 个点滑了：邮件摘要功能推到下个迭代——第三方集成比估算的耗时更长。", "start": 15.576, "end": 26.904}, {"sp": "Sophie", "role": "", "en": "So about eighty-two percent velocity. Not bad, but the email digest pushed twice now. We should probably spike on the integration in the planning session.", "zh": "那大约 82% 的速率。不算差，但邮件摘要已经推了两次。我们该在计划会上针对这个集成做一次技术探针（spike）。", "start": 26.904, "end": 39.36}, {"sp": "Ben", "role": "", "en": "Agreed. I'll add a tech spike to the backlog for that. One hour scoped.", "zh": "同意。我把它作为技术探针加进待办列表，限定一小时。", "start": 39.36, "end": 46.488}, {"sp": "Sophie", "role": "", "en": "Good. Also — we had one incident this sprint. Sam?", "zh": "好。另外——这个迭代出了一次事故。Sam？", "start": 46.488, "end": 52.968}, {"sp": "Sam", "role": "DevOps", "en": "Yeah, a twelve-minute outage Tuesday caused by a config deployment without rollback. I'm adding a rollback verification step to our deploy checklist. It's a process fix, not a code fix.", "zh": "对，周二一次 12 分钟的中断，起因是一次没有回滚方案的配置发布。我正在给部署清单加一步回滚验证。这是流程修复，不是代码修复。", "start": 52.968, "end": 67.968}, {"sp": "Sophie", "role": "", "en": "Thanks Sam. OK — retrospective in ten minutes. See you there.", "zh": "谢谢 Sam。好——10 分钟后开回顾会，到时候见。", "start": 67.968, "end": 75.216}]}, {"id": "d5", "title": "05 跨时区异步站会（英音）", "file": "05-跨时区站会/05-跨时区站会.mp3", "duration": 52.54, "lines": [{"sp": "旁白", "role": "", "en": "Distributed team standup across three time zones. London, Warsaw, Singapore.", "zh": "跨三个时区的分布式团队站会：伦敦、华沙、新加坡。", "start": 0.0, "end": 7.488}, {"sp": "Ava", "role": "London, Team Lead", "en": "Quick reminder — async standups via Slack are fine for non-critical days, but let's do a sync call on Mondays. Today's Tuesday, so this is async — I'll just read out the updates.", "zh": "快速提醒——非关键的日子用 Slack 异步站会就行，但周一我们还是开一次同步电话会。今天周二，所以是异步——我把大家的更新读一遍。", "start": 7.488, "end": 18.984}, {"sp": "Ava", "role": "", "en": "From Jamie in Singapore: completed the data pipeline refactor, starting on the caching layer. No blockers, but he wants eyes on his schema design — will post in dev-review.", "zh": "新加坡的 Jamie：数据管道重构已完成，开始做缓存层。没有阻塞，但他希望有人看看他的 schema 设计——会发到 dev-review 频道。", "start": 18.984, "end": 30.24}, {"sp": "Ava", "role": "", "en": "From Marta in Warsaw: PR two twenty-three is ready for review. She'll be out of office Thursday afternoon, back Friday.", "zh": "华沙的 Marta：PR #223 已就绪待评审。她周四下午不在（OOO），周五回来。", "start": 30.24, "end": 38.664}, {"sp": "Ava", "role": "", "en": "From myself: in product meetings all morning, available from one PM London. Our retrospective is Thursday at four PM London, five PM Warsaw, eleven PM Singapore. I'll record it for Jamie.", "zh": "我自己：一上午都在产品会，伦敦时间下午 1 点起有空。回顾会在伦敦时间周四 16:00、华沙 17:00、新加坡 23:00。我会录下来发给 Jamie。", "start": 38.664, "end": 52.536}]}];
const au = document.getElementById('au');
const picker = document.getElementById('picker');
const tr = document.getElementById('tr');
const cnt = document.getElementById('cnt');
const spk = document.getElementById('spk');
const sen = document.getElementById('sen');
const szh = document.getElementById('szh');
const loopBtn = document.getElementById('loop');

let di = 0, mode = 'both', rate = 1, lineLoop = false, curLine = -1;

function load(i){
  di = i; curLine = -1;
  au.src = 'audio/standup/' + DATA[i].file;
  const v = document.getElementById('vlink');
  const dir = DATA[i].file.split('/')[0];
  v.innerHTML = '本段单独页面：<a href="audio/standup/' + dir + '/' + dir + '.html"><b>' + dir + '.html</b></a>'
    + ' &nbsp;·&nbsp; 文件夹：<code>audio/standup/' + dir + '/</code>'
    + ' &nbsp;·&nbsp; 同名字幕（PotPlayer 自动加载）：<code>' + dir + '.vtt</code> 中英 · <code>' + dir + '.en.vtt</code> 英文 · <code>' + dir + '.zh.vtt</code> 中文';
  au.playbackRate = rate;
  buildPicker(); buildTranscript(); renderCue(-1);
}
function buildPicker(){
  picker.innerHTML = '';
  DATA.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === di ? ' on' : '');
    b.textContent = d.title;
    b.onclick = () => load(i);
    picker.appendChild(b);
  });
}
function buildTranscript(){
  tr.innerHTML = '';
  DATA[di].lines.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'row'; row.dataset.i = i;
    row.innerHTML = '<div class="idx">' + (i + 1) + '</div>'
      + '<div class="body"><div class="who">' + esc(c.sp + (c.role ? ' · ' + c.role : '')) + '</div>'
      + '<div class="e">' + esc(c.en) + '</div>'
      + '<div class="z">' + esc(c.zh) + '</div></div>'
      + '<button class="rep" title="只循环这一句">循环</button>';
    row.onclick = e => { if (e.target.classList.contains('rep')) return; seekLine(i); };
    row.querySelector('.rep').onclick = e => {
      e.stopPropagation();
      loopLineBtn_idx = i; lineLoop = true; loopBtn.classList.add('on');
      markRep(i); seekLine(i); au.play();
    };
    tr.appendChild(row);
  });
}
let loopLineBtn_idx = -1;
function markRep(i){
  tr.querySelectorAll('.rep').forEach((b, k) => b.classList.toggle('on', k === i));
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function seekLine(i){
  const c = DATA[di].lines[i];
  au.currentTime = c.start;
  curLine = -1;
  if (lineLoop) loopLineBtn_idx = i;
}
function renderCue(i){
  if (i === curLine) return;
  curLine = i;
  tr.querySelectorAll('.row').forEach((r, k) => r.classList.toggle('on', k === i));
  if (i < 0){ spk.textContent = ''; sen.textContent = ''; szh.textContent = ''; return; }
  const c = DATA[di].lines[i];
  spk.textContent = c.sp + (c.role ? ' · ' + c.role : '') + '   [' + fmt(c.start) + ']';
  sen.textContent = c.en;
  szh.textContent = c.zh;
  applyMode();
}
function applyMode(){
  sen.classList.toggle('hide', !(mode === 'en' || mode === 'both'));
  szh.classList.toggle('hide', !(mode === 'zh' || mode === 'both'));
  spk.classList.toggle('hide', mode === 'off');
}
function fmt(t){
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function tick(){
  const L = DATA[di].lines, t = au.currentTime;
  if (lineLoop && loopLineBtn_idx >= 0){
    const c = L[loopLineBtn_idx];
    if (t >= c.end - 0.05 || t < c.start - 0.15){ au.currentTime = c.start; }
  }
  let found = -1;
  for (let i = 0; i < L.length; i++){ if (t >= L[i].start - 0.05) found = i; else break; }
  renderCue(found);
  cnt.textContent = (found < 0 ? 0 : found + 1) + ' / ' + L.length;
}

document.querySelectorAll('.sp').forEach(b => {
  b.onclick = () => {
    rate = parseFloat(b.dataset.s);
    au.playbackRate = rate;
    document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  };
});
document.querySelectorAll('.md').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll('.md').forEach(x => x.classList.toggle('on', x === b));
    if (mode === 'off'){ spk.textContent=''; sen.textContent=''; szh.textContent=''; }
    else { const c = DATA[di].lines[curLine]; if (c){ spk.textContent = c.sp + '   [' + fmt(c.start) + ']'; sen.textContent = c.en; szh.textContent = c.zh; } }
    applyMode();
  };
});
document.getElementById('prev').onclick = () => { const i = Math.max(0, curLine - 1); seekLine(i); };
document.getElementById('next').onclick = () => { const i = Math.min(DATA[di].lines.length - 1, curLine + 1); seekLine(i); };
loopBtn.onclick = () => {
  lineLoop = !lineLoop;
  loopBtn.classList.toggle('on', lineLoop);
  if (lineLoop){ loopLineBtn_idx = Math.max(0, curLine); markRep(loopLineBtn_idx); }
  else { loopLineBtn_idx = -1; markRep(-1); }
};
au.addEventListener('timeupdate', tick);
au.addEventListener('seeked', () => { curLine = -1; tick(); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (e.code === 'Space'){ e.preventDefault(); au.paused ? au.play() : au.pause(); }
  else if (e.code === 'ArrowLeft'){ au.currentTime = Math.max(0, au.currentTime - 3); }
  else if (e.code === 'ArrowRight'){ au.currentTime = Math.min(au.duration || 1e9, au.currentTime + 3); }
  else if (e.code === 'ArrowUp'){ e.preventDefault(); document.getElementById('prev').click(); }
  else if (e.code === 'ArrowDown'){ e.preventDefault(); document.getElementById('next').click(); }
});

document.querySelector('.sp[data-s="1"]').classList.add('on');
document.querySelector('.md[data-m="both"]').classList.add('on');

const FS_KEY = 'standup-fs';
function setFs(v){
  document.documentElement.setAttribute('data-fs', v);
  document.querySelectorAll('.fs').forEach(b => b.classList.toggle('on', b.dataset.f === v));
  try { localStorage.setItem(FS_KEY, v); } catch(e){}
}
document.querySelectorAll('.fs').forEach(b => { b.onclick = () => setFs(b.dataset.f); });
try { setFs(localStorage.getItem(FS_KEY) || 'md'); } catch(e){ setFs('md'); }

load(1);
</script>
</body>
</html>
